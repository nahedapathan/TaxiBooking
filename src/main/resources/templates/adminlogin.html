<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f7c873, #e0a800);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .login-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .error-message {
            color: red;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logout-message {
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="password"] {
            font-family: 'Arial', sans-serif;
        }

        button {
            background-color: #d49f00;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #b88400;
        }
    </style>
</head>
<body>

    <!-- Error Message -->
    <div th:if="${param.error}" class="error-message">
        <h2>❌ INVALID CREDENTIALS</h2>
    </div>

    <!-- Logout Message -->
    <div th:if="${logout}" class="logout-message">
        <h2>✅ YOU HAVE BEEN SUCCESSFULLY LOGGED OUT</h2>
    </div>

    <div class="login-container">
        <h2>🔐 Admin Login</h2>
        <form action="/login" method="post">
            <input name="username" type="text" placeholder="Enter Username" required>
            <input name="password" type="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
