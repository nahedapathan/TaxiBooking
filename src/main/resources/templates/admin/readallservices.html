<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f7c531, #ffaf00);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 18px;
            color: #333;
            background: #eee;
            padding: 10px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #f7c531;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f7c531;
            color: white;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .service-img {
            width: 100px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: block;
            margin: auto;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            display: inline-block;
            text-align: center;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #cc0000;
        }

        .image-container {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔧 Service Details</h1>

        <div class="nav-links">
            <a href="dashboard">🏠 Dashboard</a>
            <a href="/dologout">🚪 Logout</a>
        </div>

        <h3 th:text="${message}" style="color: red;"></h3>

        <table>
            <thead>
                <tr>
                    <th>📌 ID</th>
                    <th>🖼 Image</th>
                    <th>📌 Title</th>
                    <th>📝 Description</th>
                    <th>❌ Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="service : ${allServices}">
                    <td th:text="${service.id}"></td>
                    <td>
                        <div class="image-container">
                            <img th:src="${service.image}" alt="Service Image" class="service-img">
                            <p th:text="${service.image}" style="font-size: 12px; color: gray;"></p>
                        </div>
                    </td>
                    <td th:text="${service.title}"></td>
                    <td th:text="${service.description}"></td>
                    <td>
                        <a th:href="@{/admin/deleteServices/{id} (id=${service.id})}" class="delete-btn">🗑 Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
