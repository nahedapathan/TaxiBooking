<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Credentials</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f7c873, #e0a800);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .form-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            text-align: left;
            margin: 10px 0 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="password"] {
            font-family: 'Arial', sans-serif;
        }

        button {
            background-color: #d49f00;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #b88400;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .top-buttons a {
            text-decoration: none;
            padding: 10px 15px;
            color: white;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .dashboard {
            background-color: #007bff;
        }

        .dashboard:hover {
            background-color: #0056b3;
        }

        .logout {
            background-color: #dc3545;
        }

        .logout:hover {
            background-color: #b52b37;
        }

    </style>
</head>
<body>

    <!-- Top Navigation Buttons -->
    <div class="top-buttons">
        <a href="dashboard" class="dashboard">🏠 Dashboard</a>
        <a href="/dologout" class="logout">🚪 Logout</a>
       
    </div>

    <div class="form-container">
        <h2>🔑 Change Credentials</h2>
        <form action="changeCredentials" method="post">
            <label for="oldusername">👤 Old Username:</label>
            <input type="text" id="oldusername" name="oldusername" placeholder="Enter Old Username" required>

            <label for="oldpassword">🔒 Old Password:</label>
            <input type="password" id="oldpassword" name="oldpassword" placeholder="Enter Old Password" required>

            <label for="newusername">👤 New Username:</label>
            <input type="text" id="newusername" name="newusername" placeholder="Enter New Username" required>

            <label for="newpassword">🔑 New Password:</label>
            <input type="password" id="newpassword" name="newpassword" placeholder="Enter New Password" required>

            <button type="submit">Change</button>
        </form>
    </div>

</body>
</html>
