

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f7c531, #ffaf00); /* Dark Yellow Gradient */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 18px;
            color: #333;
            background: #eee;
            padding: 10px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #f7c531;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f7c531;
            color: white;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📖 Booking Details</h2>

        <div class="nav-links">
            <a href="dashboard">🏠 Dashboard</a>
            <a href="/dologout">🚪 Logout</a>
        </div>

        <h3 th:text="${message}" style="color: red;"></h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Source</th>
                    <th>Destination</th>
                    <th>Time</th>
                    <th>Date</th>
                    <th>Comfort</th>
                    <th>Adults</th>
                    <th>Children</th>
                    <th>Message</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${allBookings}">
                    <td th:text="${booking.id}"></td>
                    <td th:text="${booking.name}"></td>
                    <td th:text="${booking.email}"></td>
                    <td th:text="${booking.source}"></td>
                    <td th:text="${booking.destination}"></td>
                    <td th:text="${booking.time}"></td>
                    <td th:text="${booking.date}"></td>
                    <td th:text="${booking.comfort}"></td>
                    <td th:text="${booking.adult}"></td>
                    <td th:text="${booking.children}"></td>
                    <td th:text="${booking.message}"></td>
                    <td>
                        <a th:href="@{/admin/deleteBooking/{id} (id=${booking.id})}" class="delete-btn">🗑 Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
