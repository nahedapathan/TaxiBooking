<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f7c531, #ffaf00);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        h3 {
            color: red;
        }

        label {
            font-weight: bold;
            display: block;
            text-align: left;
            margin: 10px 0 5px;
            color: #555;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="file"] {
            padding: 3px;
            background: #f9f9f9;
        }

        button {
            background: #f7c531;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #e6a900;
        }

        .nav-links {
            margin-bottom: 15px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 14px;
            color: white;
            background: #333;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #444;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>📝 Add New Service</h2>
        
        <div class="nav-links">
            <a href="dashboard">🏠 Dashboard</a>
        </div>

        <h3 th:text="${msg}"></h3>

        <form action="addService" method="post" enctype="multipart/form-data">
            <label for="serviceImage">📸 Service Image:</label>
            <input type="file" id="serviceImage" name="image" accept="image/*">

            <label for="serviceTitle">📌 Service Title:</label>
            <input type="text" id="serviceTitle" name="title" placeholder="Enter service title" required>

            <label for="serviceDescription">📝 Service Description:</label>
            <textarea id="serviceDescription" name="description" rows="4" placeholder="Enter service description" required></textarea>

            <button type="submit">✅ Submit</button>
        </form>
    </div>

</body>
</html>
