<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f7c531, #ffaf00); /* Dark Yellow Gradient */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 18px;
            color: #333;
            background: #eee;
            padding: 10px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #f7c531;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f7c531;
            color: white;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📩 Read All Contacts</h1>

        <div class="nav-links">
            <a href="dashboard">🏠 Dashboard</a>
            <a href="/dologout">🚪 Logout</a>
        </div>

        <h3 th:text="${message}" style="color: red;"></h3>

        <table>
            <thead>
                <tr>
                    <th>📌 ID</th>
                    <th>👤 Name</th>
                    <th>📧 Email</th>
                    <th>📞 Phone</th>
                    <th>💬 Message</th>
                    <th>❌ Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contact : ${allcontacts}">
                    <td th:text="${contact.id}"></td>
                    <td th:text="${contact.name}"></td>
                    <td th:text="${contact.email}"></td>
                    <td th:text="${contact.phone}"></td>
                    <td th:text="${contact.message}"></td>
                    <td>
                        <a th:href="@{/admin/deleteContact/{id} (id=${contact.id})}" class="delete-btn">🗑 Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
